# Produção local com MySQL 8. Defina as variáveis no arquivo .env (veja .env.example).
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-atlas}
      MYSQL_USER: ${MYSQL_USER:-atlas}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      retries: 10
  api:
    build: .
    restart: unless-stopped
    depends_on: { mysql: { condition: service_healthy } }
    env_file: .env
    environment:
      NODE_ENV: production
      DB_CLIENT: mysql
      MYSQL_HOST: mysql
    ports: ["3333:3333"]
volumes:
  mysql-data:
